# Configuration for actions/labeler v5: labels PRs from the files they change and from the branch name.
# (The labeler does not read issue or PR text; issue labels come from the issue templates.)

bug:
  - head-branch: ['^fix/', '^bugfix/', '^hotfix/']

feature:
  - head-branch: ['^feat/', '^feature/']

refactor:
  - head-branch: ['^refactor/']

documentation:
  - changed-files:
      - any-glob-to-any-file: ['**/*.md', 'docs/**']

tests:
  - changed-files:
      - any-glob-to-any-file: ['**/src/test/**']

dependencies:
  - changed-files:
      - any-glob-to-any-file: ['**/pom.xml', '.github/dependabot.yml']

ci/cd:
  - changed-files:
      - any-glob-to-any-file: ['.github/workflows/**']

runtime:
  - changed-files:
      - any-glob-to-any-file: ['src/main/**']
