# actions/labeler v5 configuration. The action labels pull requests from
# changed files and branch names; issue title/body matching is intentionally
# omitted because it is not supported by actions/labeler v5.

bug:
  - head-branch: ['bug', 'fix', 'hotfix']
  - changed-files:
      - any-glob-to-any-file: ['fix/**', 'hotfix/**', '**/*.bug']

feature:
  - head-branch: ['^feature', 'feature', 'feat']
  - changed-files:
      - any-glob-to-any-file: ['feat/**', '**/*.feature']

documentation:
  - changed-files:
      - any-glob-to-any-file: ['docs/**', '**/*.md', 'README.md', 'CONTRIBUTING.md']

security:
  - head-branch: ['security', 'vulnerability', 'CVE-[0-9]{4}-[0-9]+']

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - 'pom.xml'
          - '**/pom.xml'
          - 'package.json'
          - 'package-lock.json'
          - 'requirements.txt'

tests:
  - head-branch: ['test', 'tests']
  - changed-files:
      - any-glob-to-any-file:
          - 'tests/**'
          - '**/src/test/**'
          - '**/*Test.java'
          - '**/*.test.*'

ci/cd:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/workflows/**'
          - '.gitlab-ci.yml'
          - 'Jenkinsfile'

refactor:
  - head-branch: ['refactor', 'cleanup']

ui/ux:
  - head-branch: ['ui', 'ux', 'frontend', 'design']
  - changed-files:
      - any-glob-to-any-file:
          - '**/*.css'
          - '**/*.scss'
          - '**/*.js'
          - '**/*.ts'
          - '**/*.jsx'
          - '**/*.tsx'
