name: Auto Label PRs

# pull_request_target so the token can write labels on PRs from forks. This is safe here because the job
# never checks out or runs code from the PR: labeler reads its configuration from the base branch.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions: {}

concurrency:
  group: auto-label-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    name: Label the PR
    runs-on: ubuntu-latest
    permissions:
      contents: read # read .github/labeler.yml
      pull-requests: write # set labels
    steps:
      - name: Label the PR from changed files and branch name
        uses: actions/labeler@8558fd74291d67161a8a78ce36a881fa63b766a9 # v5.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
