name: External PR Branch Enforcer

on:
  pull_request:
    types: [opened, edited, synchronize]

permissions: {}

concurrency:
  group: branch-enforcer-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check-target-branch:
    name: Check target branch
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write # retarget the PR to develop
      issues: write # comment on the PR
    steps:
      - name: Check PR target branch
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            
            if (pr.base.ref !== 'develop' && pr.user.login !== process.env.REPOSITORY_OWNER) {
              try {
                await github.rest.issues.createComment({
                  ...context.repo,
                  issue_number: pr.number,
                  body: '🤖 Attention! Always use the develop branch for your PRs instead of ' + pr.base.ref + '.' 
                });
                
                await github.rest.pulls.update({
                  ...context.repo,
                  pull_number: pr.number,
                  base: 'develop'
                });
                
                await github.rest.issues.createComment({
                  ...context.repo,
                  issue_number: pr.number,
                  body: '🤖 I\'ve automatically updated this PR to target the develop branch.'
                });
              } catch (error) {
                throw error;
              }
            }
