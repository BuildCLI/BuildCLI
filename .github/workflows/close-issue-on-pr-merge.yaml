name: Close Issue on PR Merge

on:
  pull_request:
    types: [closed]

permissions: {}

concurrency:
  group: close-issue-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  close-issue:
    name: Close the linked issue
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true
    permissions:
      issues: write # close the linked issue and comment

    steps:
      - name: Extract Issue Number and Close Issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
        run: |
          echo "Checking PR description for linked issues..."

          # grep exits 1 when nothing matches; under the runner's default `bash -eo pipefail` that would abort the
          # script before the "no linked issue" branch below, so the match is allowed to fail.
          ISSUE_NUMBERS=$(printf '%s\n' "$PR_BODY" | grep -oiE '(closes|fixes) #[0-9]+' | grep -oE '[0-9]+' || true)

          if [ -n "$ISSUE_NUMBERS" ]; then
            for ISSUE_NUMBER in $ISSUE_NUMBERS; do
              echo "Closing issue #$ISSUE_NUMBER"
              curl -X PATCH \
                -H "Authorization: token $GITHUB_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$REPO/issues/$ISSUE_NUMBER" \
                -d '{"state":"closed"}'

              echo "Adding comment to issue #$ISSUE_NUMBER"
              curl -X POST \
                -H "Authorization: token $GITHUB_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$REPO/issues/$ISSUE_NUMBER/comments" \
                -d '{"body": "The issue has been successfully closed as the related PR has been merged."}'
            done
          else
            echo "No linked issue found in PR description. Commenting on PR."
            COMMENT_BODY="@${ACTOR} Please ensure this PR references an issue using 'Closes #ISSUE_NUMBER' or 'Fixes #ISSUE_NUMBER'."
            curl -X POST \
              -H "Authorization: token $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/issues/$PR_NUMBER/comments" \
              -d "{\"body\": \"$COMMENT_BODY\"}"
          fi
          echo "Process completed."
